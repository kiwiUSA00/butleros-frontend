  /* ============ ROUTER ============ */
  function renderPage(){
    const root = document.getElementById('pageRoot');
    let html = '';
    if(state.page === 'home') html = pageHome();
    else if(state.page === 'lifestyle') html = categoryPage('Lifestyle', 'The people, tables, and access worth having on standby.', 'lifestyle');
    else if(state.page === 'travel') html = categoryPage('Travel', 'Itineraries, flights, and stays, arranged quietly.', 'travel');
    else if(state.page === 'dining') html = categoryPage('Dining', 'Tables you could not get on your own.', 'dining');
    else if(state.page === 'wellness') html = categoryPage('Wellness', 'Rest, recovery, and the occasional discipline.', 'wellness');
    else if(state.page === 'finance') html = pageFinance();
    else if(state.page === 'calendar') html = pageCalendar();
    else if(state.page === 'requests') html = pageRequests();
    else if(state.page === 'messages') html = pageMessages();
    else if(state.page === 'profile') html = pageProfile();
    else if(state.page === 'detail') html = pageDetail();

    root.innerHTML = html;
    bindPageEvents();
  }

  function bindPageEvents(){
    const root = document.getElementById('pageRoot');
    bindCuratedClicks(root);

    root.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => navigate(el.dataset.nav)));
    root.querySelectorAll('[data-pick]').forEach(el => el.addEventListener('click', () => toast('Saved to your reading list.')));

    const heroBtn = document.getElementById('heroRequestBtn');
    if(heroBtn) heroBtn.addEventListener('click', () => openRequestModal());

    const journalBtn = document.getElementById('journalBtn');
    if(journalBtn) journalBtn.addEventListener('click', () => toast('Opening the Journal...'));

    const newRequestBtn = document.getElementById('newRequestBtn');
    if(newRequestBtn) newRequestBtn.addEventListener('click', () => openRequestModal());

    const addEventBtn = document.getElementById('addEventBtn');
    if(addEventBtn) addEventBtn.addEventListener('click', addEvent);

    const retryFinance = document.getElementById('retryFinance');
    if(retryFinance) retryFinance.addEventListener('click', () => loadFinance());

    const exploreLocationBtn = document.getElementById('exploreLocationBtn');
    const exploreLocationInput = document.getElementById('exploreLocationInput');
    if(exploreLocationBtn && exploreLocationInput){
      exploreLocationBtn.addEventListener('click', () => setExploreLocation(exploreLocationInput.value));
      exploreLocationInput.addEventListener('keydown', e => { if(e.key === 'Enter') setExploreLocation(exploreLocationInput.value); });
    }

    root.querySelectorAll('[data-filter-cat]').forEach(el => {
      el.addEventListener('click', () => setCategoryFilter(el.dataset.filterCat, el.dataset.filterQuery));
    });
    root.querySelectorAll('[data-loadmore-cat]').forEach(el => {
      el.addEventListener('click', () => loadCategoryPlaces(el.dataset.loadmoreCat, { pageToken: el.dataset.loadmoreToken }));
    });

    root.querySelectorAll('[data-search-input-cat]').forEach(input => {
      input.addEventListener('keydown', e => { if(e.key === 'Enter') setCategorySearch(input.dataset.searchInputCat, input.value); });
    });
    root.querySelectorAll('[data-search-btn-cat]').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = root.querySelector(`[data-search-input-cat="${btn.dataset.searchBtnCat}"]`);
        setCategorySearch(btn.dataset.searchBtnCat, input ? input.value : '');
      });
    });
    root.querySelectorAll('[data-sort-cat]').forEach(sel => {
      sel.addEventListener('change', () => setCategorySort(sel.dataset.sortCat, sel.value));
    });

    const spotlightPrevBtn = document.getElementById('spotlightPrev');
    const spotlightNextBtn = document.getElementById('spotlightNext');
    if(spotlightPrevBtn) spotlightPrevBtn.addEventListener('click', () => spotlightPrev());
    if(spotlightNextBtn) spotlightNextBtn.addEventListener('click', () => spotlightNext());
    root.querySelectorAll('[data-spotlight-dot]').forEach(el => {
      el.addEventListener('click', () => spotlightGoTo(parseInt(el.dataset.spotlightDot, 10)));
    });

    root.querySelectorAll('[data-place-id]').forEach(el => {
      el.addEventListener('click', () => {
        const item = findPlaceItemById(el.dataset.placeId);
        if(item) openDetail(normalizePlaceDetail(item));
      });
    });
    const spotlightDetailBtn = document.getElementById('spotlightDetailBtn');
    if(spotlightDetailBtn){
      spotlightDetailBtn.addEventListener('click', () => {
        const item = findPlaceItemById(spotlightDetailBtn.dataset.spotlightPlaceId);
        if(item) openDetail(normalizePlaceDetail(item));
      });
    }
    const detailBackBtn = document.getElementById('detailBackBtn');
    if(detailBackBtn) detailBackBtn.addEventListener('click', () => closeDetail());
    const detailBookBtn = document.getElementById('detailBookBtn');
    if(detailBookBtn) detailBookBtn.addEventListener('click', () => bookFromDetail());

    const chatSend = document.getElementById('chatSend');
    const chatInput = document.getElementById('chatInput');
    if(chatSend){
      chatSend.addEventListener('click', sendChat);
      chatInput.addEventListener('keydown', e => { if(e.key === 'Enter') sendChat(); });
    }

    const saveProfile = document.getElementById('saveProfile');
    if(saveProfile){
      saveProfile.addEventListener('click', async () => {
        const name = document.getElementById('pfName').value || state.profile.name;
        const email = document.getElementById('pfEmail').value || state.profile.email;
        const phone = document.getElementById('pfPhone').value || state.profile.phone;
        const mood = document.getElementById('pfMood').value || state.profile.mood;
        const budgetBand = document.getElementById('pfBudget').value;
        const favoriteLocations = document.getElementById('pfLocations').value.split(',').map(s=>s.trim()).filter(Boolean);

        state.profile = Object.assign({}, state.profile, { name, email, phone, mood, budgetBand, favoriteLocations });

        try{
          await apiPut('/user/' + USER_ID, { name, email, preferences: { mood, budgetBand, favoriteLocations } });
          toast('Profile saved to BOS.');
          loadWeather(); // favorite location may have changed
        }catch(err){
          toast('Saved locally — backend unreachable (' + err.message + ').', { warn:true });
        }
        renderGreeting();
      });
    }
  }

  /* ============ CALENDAR ============ */
  function addEvent(){
    const title = prompt('What should Isabella schedule?');
    if(!title) return;
    const timeStr = prompt('What time? (e.g. 9:00 AM)', '9:00 AM') || '9:00 AM';

    // Turn "9:00 AM" into today's ISO start/end (1hr block).
    const now = new Date();
    const m = /^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i.exec(timeStr.trim());
    let hour = m ? parseInt(m[1],10) : 9;
    const minute = m ? parseInt(m[2],10) : 0;
    if(m && m[3] && /pm/i.test(m[3]) && hour < 12) hour += 12;
    if(m && m[3] && /am/i.test(m[3]) && hour === 12) hour = 0;
    const start = new Date(now); start.setHours(hour, minute, 0, 0);
    const end = new Date(start.getTime() + 60*60*1000);

    apiPost('/butler/calendar-event', {
      userId: USER_ID, title, start: start.toISOString(), end: end.toISOString(), type: 'personal',
    }).then(() => {
      toast('Added to the calendar.');
      return loadCalendar();
    }).catch(err => {
      // Fall back to a local-only entry so the UI still responds.
      state.events.push({ day:'This Week', time:timeStr, title, sub:'Added by you (offline)' });
      renderPage();
      toast('Added locally — backend unreachable (' + err.message + ').', { warn:true });
    });
  }

  function dayLabelFor(iso){
    const d = new Date(iso);
    const today = new Date();
    const startOfDay = (x) => { const y = new Date(x); y.setHours(0,0,0,0); return y.getTime(); };
    const diffDays = Math.round((startOfDay(d) - startOfDay(today)) / 86400000);
    if(diffDays === 0) return 'Today';
    if(diffDays === 1) return 'Tomorrow';
    return d.toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });
  }
  function timeLabelFor(iso){
    return new Date(iso).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
  }

  async function loadCalendar(){
    try{
      const events = await apiGet('/butler/calendar-events/' + USER_ID);
      state.events = events
        .slice()
        .sort((a,b) => new Date(a.start) - new Date(b.start))
        .map(e => ({ day: dayLabelFor(e.start), time: timeLabelFor(e.start), title: e.title, sub: e.location || '' }));
      state.live = true;
    }catch(err){
      // Backend unreachable — leave state.events as whatever it already was
      // (empty by default; never falls back to fabricated events).
    }
    if(state.page === 'calendar' || state.page === 'home') renderPage();
  }

  /* ============ FINANCE ============ */
  async function loadFinance(){
    state.financeLoading = true;
    state.financeError = null;
    if(state.page === 'finance') renderPage();
    try{
      const data = await apiPost('/butler/optimize-money', { userId: USER_ID });
      state.finance = data;
      state.live = true;
    }catch(err){
      state.financeError = err.message;
    }finally{
      state.financeLoading = false;
      if(state.page === 'finance') renderPage();
      renderGreeting();
    }
  }

  /* ============ HOME / CURATED (live) ============ */
  async function loadButlerRun(){
    try{
      const results = await apiPost('/butler/run', { userId: USER_ID });
      state.curatedLive = buildLiveCurated(results);
      state.live = true;
      if(['home','lifestyle','travel','dining','wellness'].includes(state.page)) renderPage();
      renderGreeting();
    }catch(err){
      // Backend unreachable — state.curatedLive stays null, home/category
      // pages render their honest empty states.
    }
  }

  /* ============ WEATHER (live) ============
     Hits GET /butler/weather, which calls real OpenWeather/Tomorrow.io APIs
     server-side if WEATHER_KEY / TOMORROWIO_KEY are set. The response's
     `live` flag tells us whether a real call actually succeeded — if not,
     state.weather stays null and the UI shows "Weather not connected yet"
     rather than a fabricated forecast. */
  /* The location every live widget (weather, destination guide, category
     places) currently reflects. Defaults to the profile's favorite
     location once loaded, but the user can switch it live via the search
     box on any category page — see setExploreLocation(). */
  function currentLocation(){
    return state.exploreLocation || (state.profile.favoriteLocations && state.profile.favoriteLocations[0]) || 'Austin';
  }

  async function loadWeather(){
    const location = currentLocation();
    try{
      const data = await apiGet('/butler/weather?location=' + encodeURIComponent(location));
      if(data.live){
        state.weather = { location, tempF: data.tempF, conditions: data.conditions, live: true };
        state.live = true;
      } else if(state.weather && state.weather.location !== location){
        state.weather = null; // stale location's data — don't keep showing it as if it were current
      }
      if(state.page === 'home') renderPage();
    }catch(err){
      // Backend unreachable — state.weather stays whatever it was.
    }
  }

  /* ============ DESTINATION GUIDE (live) ============
     Hits GET /butler/destination-guide, which pulls a real Wikivoyage
     article excerpt server-side — no API key required on either end.
     Shown on the Travel page. */
  async function loadDestinationGuide(){
    const location = currentLocation();
    if(state.destinationGuide && state.destinationGuide.location === location && state.destinationGuide.live) return; // already have it
    state.destinationGuideLoading = true;
    if(state.page === 'travel') renderPage();
    try{
      const data = await apiGet('/butler/destination-guide?location=' + encodeURIComponent(location));
      state.destinationGuide = Object.assign({ location }, data);
      if(data.live) state.live = true;
    }catch(err){
      // Backend unreachable — state.destinationGuide stays whatever it was.
    }finally{
      state.destinationGuideLoading = false;
      if(state.page === 'travel') renderPage();
    }
  }

  /* ============ CATEGORY PLACES (live) ============
     Hits GET /butler/places (real Google Places text search) with a
     category- and filter-specific query, for whichever category page is
     open. Each category gets genuinely different, live results — not the
     same feed reused four times — and `opts.pageToken` pages through
     further real results ("Load more") instead of capping at a handful. */
  async function loadCategoryPlaces(navKey, opts){
    opts = opts || {};
    const filters = CATEGORY_FILTERS[navKey];
    if(!filters) return;
    const location = currentLocation();
    const query = state.categoryFilter[navKey] || filters[0].query;
    const existing = state.categoryPlaces[navKey];
    const loadingMore = !!opts.pageToken;

    if(!opts.reset && !loadingMore && existing && existing.location === location && existing.query === query && existing.live) return; // already have it

    if(loadingMore){
      state.categoryPlaces[navKey] = Object.assign({}, existing, { loadingMore: true });
    } else {
      state.categoryPlaces[navKey] = { live: false, items: [], loading: true, loadingMore: false, location, query, nextPageToken: null };
    }
    if(state.page === navKey) renderPage();

    try{
      let url = '/butler/places?query=' + encodeURIComponent(query) + '&location=' + encodeURIComponent(location);
      if(opts.pageToken) url += '&pageToken=' + encodeURIComponent(opts.pageToken);
      const data = await apiGet(url);
      const priorItems = loadingMore ? (state.categoryPlaces[navKey].items || []) : [];
      const items = priorItems.concat(data.items || []);
      // A failed "load more" call should never wipe results that already
      // loaded successfully — only treat this as empty if we truly have
      // nothing to show.
      state.categoryPlaces[navKey] = {
        live: data.live || items.length > 0,
        items,
        loading: false,
        loadingMore: false,
        location, query,
        nextPageToken: data.live ? (data.nextPageToken || null) : (loadingMore ? existing.nextPageToken : null),
      };
      if(data.live) state.live = true;
    }catch(err){
      state.categoryPlaces[navKey] = Object.assign({}, state.categoryPlaces[navKey], { loading: false, loadingMore: false });
    }finally{
      if(state.page === navKey) renderPage();
    }
  }

  /* Called from the free-text search box on a category page — treats
     whatever the user typed as a real live query (not limited to the
     preset refine chips), reloading from scratch. */
  function setCategorySearch(navKey, text){
    const trimmed = (text || '').trim();
    if(!trimmed) return;
    state.categoryFilter[navKey] = trimmed;
    loadCategoryPlaces(navKey, { reset: true });
  }

  /* Purely a display-order change over whatever's already loaded — no
     new fetch needed. */
  function setCategorySort(navKey, mode){
    state.categorySort[navKey] = mode;
    renderPage();
  }

  /* Called when a refine chip is clicked on a category page — switches
     the live query for that category and reloads real results from
     scratch (fresh location, fresh pagination). */
  function setCategoryFilter(navKey, query){
    state.categoryFilter[navKey] = query;
    loadCategoryPlaces(navKey, { reset: true });
  }

  /* Called from the location switcher on any category page. Clears
     cached live data tied to the old location and reloads everything
     for the new one — weather, destination guide (if on Travel), and
     this category's places. */
  function setExploreLocation(newLocation){
    const trimmed = (newLocation || '').trim();
    if(!trimmed) return;
    state.exploreLocation = trimmed;
    state.weather = null;
    state.destinationGuide = null;
    state.categoryPlaces = {};
    renderPage();
    loadWeather();
    if(state.page === 'travel') loadDestinationGuide();
    if(CATEGORY_FILTERS[state.page]) loadCategoryPlaces(state.page, { reset: true });
  }

  /* ============ USER PROFILE (live) ============ */
  async function loadUser(){
    try{
      const user = await apiGet('/user/' + USER_ID);
      state.profile = Object.assign({}, state.profile, {
        name: user.name,
        email: user.email,
        mood: (user.preferences||{}).mood || state.profile.mood,
        budgetBand: (user.preferences||{}).budgetBand || state.profile.budgetBand,
        favoriteLocations: (user.preferences||{}).favoriteLocations || state.profile.favoriteLocations,
      });
      state.live = true;
      renderGreeting();
      if(state.page === 'profile') renderPage();
    }catch(err){
      // Backend unreachable — profile fields stay empty/"Not set".
    }
  }

  /* There is no live chat/assistant backend wired up yet — sending a
     message just records it locally and says so honestly, rather than
     faking a reply from "Isabella." Use the request modal / top search to
     actually trigger a real /butler/run cycle. */
  function sendChat(){
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text) return;
    const now = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    state.messages.push({ from:'me', text, time:now });
    state.messages.push({ from:'them', text:"BOS doesn't have a live chat backend connected yet, so this won't be seen. Try “Make a Request” instead — that calls the real backend.", time:now });
    input.value = '';
    renderChatOnly();
  }
  function renderChatOnly(){
    const chatBox = document.getElementById('chatMessages');
    if(!chatBox) return;
    chatBox.innerHTML = state.messages.map(m => `
      <div class="msg ${m.from==='me'?'me':'them'}">${m.text}<div class="msg-time">${m.time}</div></div>
    `).join('');
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  /* ============ REQUEST MODAL ============ */
  const requestModal = document.getElementById('requestModal');
  function openRequestModal(prefill){
    document.getElementById('requestText').value = prefill || '';
    requestModal.classList.add('show');
    document.getElementById('requestText').focus();
  }
  function closeRequestModal(){ requestModal.classList.remove('show'); }
  document.getElementById('closeModal').innerHTML = icon('close');
  document.getElementById('closeModal').addEventListener('click', closeRequestModal);
  document.getElementById('cancelRequest').addEventListener('click', closeRequestModal);
  requestModal.addEventListener('click', e => { if(e.target === requestModal) closeRequestModal(); });

  document.getElementById('submitRequest').addEventListener('click', () => {
    const text = document.getElementById('requestText').value.trim();
    if(!text) return;
    submitRequest(text);
    closeRequestModal();
  });

  /* Every request is sent to the live BOS orchestrator (POST /butler/run),
     which fans out to travel/experience/shopping/finance integrations and
     returns a summary. That summary becomes the request's confirmation text.
     Falls back to a synthetic confirmation if the backend is unreachable. */
  function submitRequest(text){
    state.requestSeq += 1;
    const req = { id: state.requestSeq, title: text, sub: 'Submitted just now', status: 'progress' };
    state.requests.unshift(req);
    toast('Isabella is on it.');
    // If this request came from the detail page's "Book Now" button, stay
    // put so its own booking timeline can track the request live — only
    // jump to the Requests page for requests made elsewhere (e.g. the
    // header/hero "Make a Request" flow).
    if(state.page !== 'detail') navigate('requests');

    apiPost('/butler/run', { userId: USER_ID })
      .then(results => {
        req.status = 'confirmed';
        req.sub = results.summary || 'Confirmed a moment ago';
        state.live = true;
        if(state.page === 'requests' || state.page === 'detail') renderPage();
        renderGreeting();
        toast(`"${text.slice(0,32)}${text.length>32?'…':''}" confirmed.`);
      })
      .catch(err => {
        req.status = 'received';
        req.sub = 'Backend unreachable (' + err.message + ') — saved locally only.';
        if(state.page === 'requests' || state.page === 'detail') renderPage();
        toast(`Couldn't reach the backend — request saved locally only.`, { warn:true });
      });
    return req;
  }

  /* ============ TOP SEARCH ============ */
  const topSearch = document.getElementById('topSearch');
  topSearch.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      const text = topSearch.value.trim();
      if(!text) return;
      topSearch.value = '';
      submitRequest(text);
    }
  });

  /* ============ SIDEBAR ICON BUTTONS ============ */
  document.getElementById('callBtn').innerHTML = icon('phone');
  document.getElementById('msgQuickBtn').innerHTML = icon('chat');
  document.getElementById('mailBtn').innerHTML = icon('mail');
  document.getElementById('callBtn').addEventListener('click', () => toast('Calling Isabella...'));
  document.getElementById('msgQuickBtn').addEventListener('click', () => navigate('messages'));
  document.getElementById('mailBtn').addEventListener('click', () => toast('Opening email to Isabella...'));
  document.getElementById('profileChip').addEventListener('click', () => navigate('profile'));

  /* ============ INIT ============
     Render immediately with empty state (so the UI never looks broken),
     then try to hydrate from the live BOS backend. Any call that
     fails just leaves the empty/"not connected" state in place — see the
     Live/Not connected pill in the header for the honest status. */
  renderNav();
  renderGreeting();
  renderPage();

  // loadUser first (it may update the favorite-location weather should use),
  // then everything else in parallel.
  loadUser().then(() => {
    Promise.allSettled([ loadCalendar(), loadButlerRun(), loadWeather(), loadHomeSpotlight() ]).then(() => {
      renderGreeting();
      if(['home','profile','calendar'].includes(state.page)) renderPage();
    });
  });

})();
</script>
</body>
